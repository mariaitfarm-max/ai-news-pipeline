name: Update AI Model Pricing

"on":
  schedule:
    # দিনে দুবার (UTC ০৩:২৩ ও ১৫:২৩); ঠিক ঘণ্টার শুরু এড়ানো হয়েছে কারণ তখন শিডিউল দেরি/বাদ পড়ে
    - cron: "23 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write # keepalive কমিটের জন্য

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: OpenRouter থেকে দাম টেনে KV-তে লেখা
        run: node scripts/update-pricing.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Keepalive (৬০ দিন নিষ্ক্রিয়তায় GitHub শিডিউল বন্ধ করে দেয়, তাই দিনে একটা কমিট)
        run: |
          mkdir -p status
          echo "Last run: $(date -u +'%Y-%m-%d %H:%M UTC')" > status/last-run.txt
          git config user.name "pricing-bot"
          git config user.email "actions@github.com"
          git add status/last-run.txt
          git diff --staged --quiet || git commit -m "chore: keepalive $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
