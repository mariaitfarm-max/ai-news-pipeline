name: Update AI Model Pricing

"on":
  schedule:
    # দিনে দুবার (UTC ০৩:২৩ ও ১৫:২৩); ঠিক ঘণ্টার শুরু এড়ানো হয়েছে কারণ তখন শিডিউল দেরি/বাদ পড়ে
    - cron: "23 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: OpenRouter থেকে দাম টেনে KV-তে লেখা
        run: node scripts/update-pricing.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: ব্যর্থ হলে Telegram
        if: failure()
        run: |
          node scripts/notify.js "❌ AI News: মডেল-দাম আপডেট ফেল করেছে — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
